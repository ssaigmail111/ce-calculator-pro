import 'package:flutter/material.dart';  
import '../models/calculation.dart';  
import '../services/database_service.dart';  
import '../utils/converters.dart';  
  
class UnitConverterProvider with ChangeNotifier {  
  String category = 'Length';  
  String fromUnit = 'Meter';  
  String toUnit = 'Foot';  
  double inputValue = 0;  
  double outputValue = 0;  
  
  List<String> get categories => Converters.categories;  
  List<String> unitsForCategory() => Converters.units(category);  
  
  void setCategory(String cat) {  
    category = cat;  
    final units = unitsForCategory();  
    fromUnit = units.first;  
    toUnit = units.length > 1 ? units[1] : units.first;  
    convert();  
    notifyListeners();  
  }  
  
  void setFromUnit(String u) {  
    fromUnit = u;  
    convert();  
    notifyListeners();  
  }  
  
  void setToUnit(String u) {  
    toUnit = u;  
    convert();  
    notifyListeners();  
  }  
  
  void setInput(double v) {  
    inputValue = v;  
    convert();  
    notifyListeners();  
  }  
  
  void convert() {  
    if (inputValue == 0) {  
      outputValue = 0;  
      return;  
    }  
    double? factor = Converters.convert(category, fromUnit, toUnit, inputValue);  
    outputValue = factor ?? 0;  
    if (factor != null) {  
      final calc = Calculation(  
        type: 'unit',  
        input: '$inputValue $fromUnit → $toUnit',  
        result: outputValue.toStringAsFixed(4),  
        timestamp: DateTime.now(),  
      );  
      DatabaseService.instance.saveCalculation(calc);  
    }  
    notifyListeners();  
  }  
}

