import 'package:sqflite/sqflite.dart';  
import 'package:path/path.dart';  
import '../models/calculation.dart';  
  
class DatabaseService {  
  static final DatabaseService instance = DatabaseService._internal();  
  factory DatabaseService() => instance;  
  DatabaseService._internal();  
  
  static Database? _db;  
  
  Future<Database> get database async {  
    if (_db != null) return _db!;  
    _db = await _initDB();  
    return _db!;  
  }  
  
  Future<Database> _initDB() async {  
    final dbPath = await getDatabasesPath();  
    final path = join(dbPath, 'ce_calculator.db');  
    return openDatabase(path, version: 1, onCreate: _onCreate);  
  }  
  
  Future _onCreate(Database db, int version) async {  
    await db.execute('''  
      CREATE TABLE calculations(  
        id INTEGER PRIMARY KEY AUTOINCREMENT,  
        type TEXT NOT NULL,  
        input TEXT,  
        result TEXT,  
        timestamp TEXT NOT NULL  
      )  
    ''');  
    await db.execute('''  
      CREATE TABLE favorite_formulas(  
        id INTEGER PRIMARY KEY AUTOINCREMENT,  
        formula_id INTEGER UNIQUE NOT NULL  
      )  
    ''');  
  }  
  
  // Calculations CRUD  
  Future<int> saveCalculation(Calculation calc) async {  
    final db = await database;  
    return db.insert('calculations', calc.toMap());  
  }  
  
  Future<List<Calculation>> getAllCalculations() async {  
    final db = await database;  
    final maps = await db.query('calculations', orderBy: 'timestamp DESC');  
    return maps.map((m) => Calculation.fromMap(m)).toList();  
  }  
  
  Future<int> deleteCalculation(int id) async {  
    final db = await database;  
    return db.delete('calculations', where: 'id = ?', whereArgs: [id]);  
  }  
  
  Future<void> clearAllCalculations() async {  
    final db = await database;  
    await db.delete('calculations');  
  }  
  
  // Favorites  
  Future<List<int>> getFavoriteIds() async {  
    final db = await database;  
    final result = await db.query('favorite_formulas');  
    return result.map((r) => r['formula_id'] as int).toList();  
  }  
  
  Future<void> addFavorite(int formulaId) async {  
    final db = await database;  
    await db.insert('favorite_formulas', {'formula_id': formulaId},  
        conflictAlgorithm: ConflictAlgorithm.ignore);  
  }  
  
  Future<void> removeFavorite(int formulaId) async {  
    final db = await database;  
    await db.delete('favorite_formulas', where: 'formula_id = ?', whereArgs: [formulaId]);  
  }  
}

