import 'dart:io';  
import 'package:flutter/material.dart';  
import 'package:pdf/pdf.dart';  
import 'package:pdf/widgets.dart' as pw;  
import 'package:path_provider/path_provider.dart';  
import 'package:share_plus/share_plus.dart';  
import '../models/calculation.dart';  
  
class PDFExportService {  
  static Future<void> exportCalculations(List<Calculation> calcs) async {  
    final pdf = pw.Document();  
    pdf.addPage(  
      pw.MultiPage(  
        build: (ctx) => [  
          pw.Header(text: 'Calculation History', level: 0),  
          pw.Table.fromTextArray(  
            headers: ['Type', 'Input', 'Result', 'Timestamp'],  
            data: calcs.map((c) => [  
              c.type,  
              c.input,  
              c.result,  
              c.timestamp.toIso8601String().substring(0, 16),  
            ]).toList(),  
          ),  
        ],  
      ),  
    );  
  
    final directory = await getTemporaryDirectory();  
    final file = File('${directory.path}/history.pdf');  
    await file.writeAsBytes(await pdf.save());  
    await Share.shareXFiles([XFile(file.path)], text: 'CE Calculator History');  
  }  
}

