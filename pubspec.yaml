import 'package:flutter/material.dart';  
import '../models/calculation.dart';  
import '../services/database_service.dart';  
import '../services/pdf_export_service.dart';  
  
class HistoryProvider with ChangeNotifier {  
  List<Calculation> _calculations = [];  
  List<Calculation> _filtered = [];  
  String _searchQuery = '';  
  
  List<Calculation> get filteredCalculations => _filtered;  
  
  HistoryProvider() {  
    loadHistory();  
  }  
  
  Future<void> loadHistory() async {  
    _calculations = await DatabaseService.instance.getAllCalculations();  
    _applyFilter();  
    notifyListeners();  
  }  
  
  void search(String query) {  
    _searchQuery = query.toLowerCase();  
    _applyFilter();  
    notifyListeners();  
  }  
  
  void _applyFilter() {  
    _filtered = _searchQuery.isEmpty  
        ? List.from(_calculations)  
        : _calculations  
            .where((c) =>  
                c.input.toLowerCase().contains(_searchQuery) ||  
                c.result.toLowerCase().contains(_searchQuery) ||  
                c.type.toLowerCase().contains(_searchQuery))  
            .toList();  
  }  
  
  Future<void> deleteCalculation(int id) async {  
    await DatabaseService.instance.deleteCalculation(id);  
    await loadHistory();  
  }  
  
  Future<void> clearAll() async {  
    await DatabaseService.instance.clearAllCalculations();  
    await loadHistory();  
  }  
  
  Future<void> exportToPDF() async {  
    await PDFExportService.exportCalculations(_calculations);  
  }  
}

