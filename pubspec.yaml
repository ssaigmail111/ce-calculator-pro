import 'package:flutter/material.dart';  
import '../models/calculation.dart';  
import '../services/database_service.dart';  
  
class ConcreteProvider with ChangeNotifier {  
  // Slab  
  double slabLength = 0, slabWidth = 0, slabThickness = 0;  
  // Beam  
  double beamLength = 0, beamWidth = 0, beamDepth = 0;  
  // Column  
  double columnSide = 0, columnHeight = 0;  
  // Footing  
  double footingLength = 0, footingWidth = 0, footingDepth = 0;  
  // Wastage  
  double wastagePercent = 5.0;  
  
  String result = '';  
  List<String> steps = [];  
  
  void setWastage(double v) {  
    wastagePercent = v;  
    notifyListeners();  
  }  
  
  void calculateSlab() {  
    double volume = slabLength * slabWidth * slabThickness;  
    _compute(volume);  
    notifyListeners();  
  }  
  
  void calculateBeam() {  
    double volume = beamLength * beamWidth * beamDepth;  
    _compute(volume);  
    notifyListeners();  
  }  
  
  void calculateColumn() {  
    double volume = columnSide * columnSide * columnHeight;  
    _compute(volume);  
    notifyListeners();  
  }  
  
  void calculateFooting() {  
    double volume = footingLength * footingWidth * footingDepth;  
    _compute(volume);  
    notifyListeners();  
  }  
  
  void _compute(double volumeM3) {  
    double wastageFactor = 1 + (wastagePercent / 100);  
    double totalVol = volumeM3 * wastageFactor;  
    double volCFT = totalVol * 35.3147;  
  
    // M20 ratio 1:1.5:3  
    double cementBags = (totalVol * 8.06); // approx bags per m³  
    double sand = totalVol * 0.42; // m³  
    double aggregate = totalVol * 0.84; // m³  
  
    steps = [  
      'Volume (without wastage) = $volumeM3 m³',  
      'Wastage $wastagePercent% => Total volume = $totalVol m³',  
      'Volume in cubic feet = $volCFT ft³',  
      'Cement = ${cementBags.toStringAsFixed(2)} bags',  
      'Sand = ${sand.toStringAsFixed(2)} m³',  
      'Aggregate = ${aggregate.toStringAsFixed(2)} m³',  
    ];  
    result = 'Concrete: $totalVol m³ | $volCFT ft³';  
  
    final calc = Calculation(  
      type: 'concrete',  
      input: 'Slab/Beam/Column calc',  
      result: result,  
      timestamp: DateTime.now(),  
    );  
    DatabaseService.instance.saveCalculation(calc);  
  }  
}

