4.22 lib/utils/converters.dart

class Converters {  
  static const Map<String, Map<String, double>> _factors = {  
    'Length': {  
      'Meter': 1,  
      'Kilometer': 0.001,  
      'Centimeter': 100,  
      'Millimeter': 1000,  
      'Mile': 0.000621371,  
      'Yard': 1.09361,  
      'Foot': 3.28084,  
      'Inch': 39.3701,  
    },  
    'Area': {  
      'Square Meter': 1,  
      'Square Kilometer': 1e-6,  
      'Square Mile': 3.861e-7,  
      'Square Yard': 1.19599,  
      'Square Foot': 10.7639,  
      'Square Inch': 1550,  
      'Hectare': 0.0001,  
      'Acre': 0.000247105,  
    },  
    'Volume': {  
      'Cubic Meter': 1,  
      'Liter': 1000,  
      'Milliliter': 1e6,  
      'Gallon (US)': 264.172,  
      'Cubic Foot': 35.3147,  
      'Cubic Inch': 61023.7,  
    },  
    'Weight': {  
      'Kilogram': 1,  
      'Gram': 1000,  
      'Milligram': 1e6,  
      'Metric Ton': 0.001,  
      'Pound': 2.20462,  
      'Ounce': 35.274,  
    },  
    'Pressure': {  
      'Pascal': 1,  
      'Kilopascal': 0.001,  
      'Bar': 1e-5,  
      'PSI': 0.000145038,  
      'Atmosphere': 9.86923e-6,  
    },  
  };  
  
  static List<String> get categories => _factors.keys.toList();  
  
  static List<String> units(String category) {  
    return _factors[category]?.keys.toList() ?? [];  
  }  
  
  static double? convert(String category, String from, String to, double value) {  
    final factors = _factors[category];  
    if (factors == null) return null;  
    if (category == 'Temperature') return _convertTemperature(from, to, value);  
    final fromFactor = factors[from];  
    final toFactor = factors[to];  
    if (fromFactor == null || toFactor == null) return null;  
    final base = value / fromFactor;  
    return base * toFactor;  
  }  
  
  static double? _convertTemperature(String from, String to, double value) {  
    double celsius;  
    switch (from) {  
      case 'Celsius': celsius = value; break;  
      case 'Fahrenheit': celsius = (value - 32) * 5 / 9; break;  
      case 'Kelvin': celsius = value - 273.15; break;  
      default: return null;  
    }  
    switch (to) {  
      case 'Celsius': return celsius;  
      case 'Fahrenheit': return celsius * 9 / 5 + 32;  
      case 'Kelvin': return celsius + 273.15;  
      default: return null;  
    }  
  }  
}

