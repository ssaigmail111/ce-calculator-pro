import 'package:flutter/material.dart';  
import '../models/calculation.dart';  
import '../services/database_service.dart';  
  
class SteelProvider with ChangeNotifier {  
  double? _selectedDiameter;  
  double length = 0;  
  int quantity = 1;  
  String result = '';  
  
  final List<double> diameters = [6, 8, 10, 12, 16, 20, 25, 32];  
  
  double? get selectedDiameter => _selectedDiameter;  
  List<double> get availableDiameters => diameters;  
  
  void setDiameter(double d) {  
    _selectedDiameter = d;  
    notifyListeners();  
  }  
  
  void setLength(double v) {  
    length = v;  
    notifyListeners();  
  }  
  
  void setQuantity(int v) {  
    quantity = v;  
    notifyListeners();  
  }  
  
  void calculateWeight() {  
    if (_selectedDiameter == null || length <= 0 || quantity <= 0) return;  
    double d = _selectedDiameter!;  
    // weight per meter = d² / 162 (kg/m)  
    double weightPerMeter = (d * d) / 162.0;  
    double totalWeight = weightPerMeter * length * quantity;  
    result =  
        'Total weight: ${totalWeight.toStringAsFixed(2)} kg\n(${weightPerMeter.toStringAsFixed(3)} kg/m × $length m × $quantity)';  
  
    final calc = Calculation(  
      type: 'steel',  
      input: 'Dia:${d}mm L:${length}m Qty:$quantity',  
      result: '${totalWeight.toStringAsFixed(2)} kg',  
      timestamp: DateTime.now(),  
    );  
    DatabaseService.instance.saveCalculation(calc);  
    notifyListeners();  
  }  
}

