                      key: Key(calc.id.toString()),  
                      onDismissed: (_) => hist.deleteCalculation(calc.id!),  
                      background: Container(color: Colors.red),  
                      child: ListTile(  
                        leading: Icon(_iconForType(calc.type)),  
                        title: Text(calc.input),  
                        subtitle: Text(calc.result),  
