3. Database Schema (SQLite)



Table calculations stores all history entries.

CREATE TABLE calculations (  
  id INTEGER PRIMARY KEY AUTOINCREMENT,  
  type TEXT NOT NULL,            -- 'scientific', 'concrete', 'steel', 'unit'  
  input TEXT,                    -- expression or input summary  
  result TEXT,                   -- computed result  
  timestamp TEXT NOT NULL        -- ISO 8601  
);

Table favorite_formulas stores only the formula IDs that the user has favourited.

CREATE TABLE favorite_formulas (  
  id INTEGER PRIMARY KEY AUTOINCREMENT,  
  formula_id INTEGER UNIQUE NOT NULL  
);


