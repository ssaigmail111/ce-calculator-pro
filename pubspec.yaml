import 'package:flutter/material.dart';  
import 'package:provider/provider.dart';  
import '../providers/calculator_provider.dart';  
  
class ScientificCalculatorScreen extends StatelessWidget {  
  const ScientificCalculatorScreen({super.key});  
  
  @override  
  Widget build(BuildContext context) {  
    final calc = context.watch<CalculatorProvider>();  
    return Column(  
      children: [  
        // Display  
        Container(  
          alignment: Alignment.bottomRight,  
          padding: const EdgeInsets.all(16),  
          child: Column(  
            crossAxisAlignment: CrossAxisAlignment.end,  
            children: [  
              Text(calc.expression, style: Theme.of(context).textTheme.headlineSmall),  
              const SizedBox(height: 8),  
              Text(calc.result, style: Theme.of(context).textTheme.headlineLarge?.copyWith(fontWeight: FontWeight.bold)),  
            ],  
          ),  
        ),  
        const Divider(),  
        // Angle toggle & copy  
        Padding(  
          padding: const EdgeInsets.symmetric(horizontal: 8.0),  
          child: Row(  
            children: [  
              ChoiceChip(  
                label: Text(calc.isRadians ? 'RAD' : 'DEG'),  
                selected: true,  
                onSelected: (_) => calc.toggleAngleMode(),  
              ),  
              const Spacer(),  
              IconButton(  
                icon: const Icon(Icons.copy),  
                tooltip: 'Copy result',  
                onPressed: () {  
                  // Copy result to clipboard  
                  ScaffoldMessenger.of(context).showSnackBar(  
                    const SnackBar(content: Text('Result copied!')),  
                  );  
                },  
              ),  
            ],  
          ),  
        ),  
        // Calculator buttons  
        Expanded(  
          child: GridView.count(  
            crossAxisCount: 5,  
            childAspectRatio: 1.2,  
            padding: const EdgeInsets.all(8),  
            children: _buttons(calc),  
          ),  
        ),  
      ],  
    );  
  }  
  
  List<Widget> _buttons(CalculatorProvider calc) {  
    final btns = [  
      'C', '⌫', '%', '÷', 'π',  
      '7', '8', '9', '×', 'e',  
      '4', '5', '6', '-', '(',  
      '1', '2', '3', '+', ')',  
      '0', '.', '!', '=', '^',  
      'sin', 'cos', 'tan', 'log', 'ln',  
      '√', 'x²', 'x³', 'xʸ', '=',  
    ];  
    return btns.map((b) {  
      return ElevatedButton(  
        onPressed: () {  
          if (b == '√') {  
            calc.input('sqrt(');  
          } else if (b == 'x²') {  
            calc.input('^2');  
          } else if (b == 'x³') {  
            calc.input('^3');  
          } else if (b == 'xʸ') {  
            calc.input('^');  
          } else {  
            calc.input(b);  
          }  
        },  
        child: Text(b, style: const TextStyle(fontSize: 16)),  
      );  
    }).toList();  
  }  
}

