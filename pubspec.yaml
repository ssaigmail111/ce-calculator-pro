import 'dart:math' as math;  
import 'package:flutter/material.dart';  
import 'package:math_expressions/math_expressions.dart';  
import '../models/calculation.dart';  
import '../services/database_service.dart';  
  
class CalculatorProvider with ChangeNotifier {  
  String _expression = '';  
  String _result = '0';  
  bool _isRadians = true;  
  final List<String> _history = [];  
  
  String get expression => _expression;  
  String get result => _result;  
  bool get isRadians => _isRadians;  
  List<String> get history => _history;  
  
  void input(String value) {  
    if (value == 'C') {  
      _expression = '';  
      _result = '0';  
    } else if (value == '⌫') {  
      _expression = _expression.isNotEmpty  
          ? _expression.substring(0, _expression.length - 1)  
          : '';  
    } else if (value == '=') {  
      _calculate();  
    } else {  
      _expression += value;  
    }  
    notifyListeners();  
  }  
  
  void _calculate() {  
    if (_expression.isEmpty) return;  
    try {  
      String exp = _expression  
          .replaceAll('×', '*')  
          .replaceAll('÷', '/')  
          .replaceAll('π', pi.toString())  
          .replaceAll('e', math.e.toString())  
          .replaceAll('^', '^'); // pow handled by parser  
  
      // Replace factorial manually (parser doesn't support !)  
      if (exp.contains('!')) {  
        exp = _handleFactorial(exp);  
      }  
  
      // Convert trig functions for degree mode  
      if (!_isRadians) {  
        exp = exp.replaceAllMapped(  
            RegExp(r'(sin|cos|tan)\(([^)]+)\)'), (match) {  
          final func = match.group(1)!;  
          final arg = match.group(2)!;  
          return '$func($arg*${math.pi / 180})';  
        });  
      }  
  
      Parser p = Parser();  
      Expression e = p.parse(exp);  
      ContextModel cm = ContextModel();  
      double eval = e.evaluate(EvaluationType.REAL, cm);  
      _result = _formatNumber(eval);  
  
      // Save to history (DB)  
      final calc = Calculation(  
        type: 'scientific',  
        input: _expression,  
        result: _result,  
        timestamp: DateTime.now(),  
      );  
      DatabaseService.instance.saveCalculation(calc);  
  
      // Keep local in-memory history for quick display  
      _history.insert(0, '$_expression = $_result');  
      if (_history.length > 20) _history.removeLast();  
    } catch (e) {  
      _result = 'Error';  
    }  
    notifyListeners();  
  }  
  
  String _handleFactorial(String exp) {  
    // Replace number! with factorial(number)  
    return exp.replaceAllMapped(RegExp(r'(\d+)!'), (match) {  
      final n = int.parse(match.group(1)!);  
      return _factorial(n).toString();  
    });  
  }  
  
  double _factorial(int n) {  
    if (n < 0) throw ArgumentError('Negative factorial');  
    double res = 1;  
    for (int i = 2; i <= n; i++) res *= i;  
    return res;  
  }  
  
  String _formatNumber(double d) {  
    if (d == d.toInt()) return d.toInt().toString();  
    return d.toStringAsFixed(6).replaceAll(RegExp(r'0*$'), '').replaceAll(RegExp(r'\.$'), '');  
  }  
  
  void toggleAngleMode() {  
    _isRadians = !_isRadians;  
    notifyListeners();  
  }  
  
  void clearHistory() {  
    _history.clear();  
    notifyListeners();  
  }  
}

