class Calculation {  
  final int? id;  
  final String type;  
  final String input;  
  final String result;  
  final DateTime timestamp;  
  
  Calculation({  
    this.id,  
    required this.type,  
    required this.input,  
    required this.result,  
    required this.timestamp,  
  });  
  
  Map<String, dynamic> toMap() => {  
        'id': id,  
        'type': type,  
        'input': input,  
        'result': result,  
        'timestamp': timestamp.toIso8601String(),  
      };  
  
  factory Calculation.fromMap(Map<String, dynamic> map) => Calculation(  
        id: map['id'],  
        type: map['type'],  
        input: map['input'],  
        result: map['result'],  
        timestamp: DateTime.parse(map['timestamp']),  
      );  
}

