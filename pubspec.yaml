import 'package:flutter/material.dart';  
import '../models/formula.dart';  
import '../services/database_service.dart';  
  
class FormulaProvider with ChangeNotifier {  
  List<Formula> _allFormulas = [];  
  List<Formula> _filtered = [];  
  Set<int> _favoriteIds = {};  
  String _searchQuery = '';  
  
  List<Formula> get filteredFormulas => _filtered;  
  bool isFavorite(int id) => _favoriteIds.contains(id);  
  
  FormulaProvider() {  
    _loadFormulas();  
    _loadFavorites();  
  }  
  
  void _loadFormulas() {  
    _allFormulas = [  
      // Concrete formulas  
      Formula(id: 1, title: 'Volume of Slab', formula: 'V = L × B × T', description: 'Calculate concrete volume for slab.', category: 'Concrete'),  
      Formula(id: 2, title: 'Volume of Beam', formula: 'V = L × B × D', description: 'Volume of rectangular beam.', category: 'Concrete'),  
      // Steel formulas  
      Formula(id: 3, title: 'Steel Weight (kg/m)', formula: 'W = D² / 162', description: 'Weight per meter for rebar.', category: 'Steel'),  
      // Structural  
      Formula(id: 4, title: 'Moment of Inertia (Rectangle)', formula: 'I = (b×h³)/12', description: 'Moment of inertia for rectangular section.', category: 'Structural'),  
      // Surveying  
      Formula(id: 5, title: 'Area by Coordinates', formula: 'A = 0.5|Σ(x_i y_{i+1} - x_{i+1} y_i)|', description: 'Area of polygon from coordinates.', category: 'Surveying'),  
      // Mathematics  
      Formula(id: 6, title: 'Quadratic Formula', formula: 'x = (-b ± √(b²-4ac))/2a', description: 'Roots of quadratic equation.', category: 'Mathematics'),  
    ];  
    _updateFilter();  
  }  
  
  void search(String query) {  
    _searchQuery = query.toLowerCase();  
    _updateFilter();  
    notifyListeners();  
  }  
  
  void _updateFilter() {  
    _filtered = _searchQuery.isEmpty  
        ? List.from(_allFormulas)  
        : _allFormulas.where((f) =>  
            f.title.toLowerCase().contains(_searchQuery) ||  
            f.formula.toLowerCase().contains(_searchQuery) ||  
            f.description.toLowerCase().contains(_searchQuery)).toList();  
  }  
  
  Future<void> _loadFavorites() async {  
    final favs = await DatabaseService.instance.getFavoriteIds();  
    _favoriteIds = favs.toSet();  
    notifyListeners();  
  }  
  
  Future<void> toggleFavorite(int formulaId) async {  
    if (_favoriteIds.contains(formulaId)) {  
      _favoriteIds.remove(formulaId);  
      await DatabaseService.instance.removeFavorite(formulaId);  
    } else {  
      _favoriteIds.add(formulaId);  
      await DatabaseService.instance.addFavorite(formulaId);  
    }  
    notifyListeners();  
  }  
}

